# PH1P35 shared PAD/PL JTAG, MCU_JTAG_SEL=0 in this project's bitstream.
# Adapter and TAP definitions follow FD's target/anlogic/ph1p35.cfg.
# TCM debug only: no Flash banks, protection changes, reset, erase or program.
# OpenOCD performs its normal automatic init; FD/GDB supplies halt/load commands.
adapter driver ftdi
adapter_khz 1000
ftdi vid_pid 0x0403 0x6042
ftdi oscan1_mode off
ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
ftdi layout_signal TCK -data 0x0001
ftdi layout_signal TDI -data 0x0002
ftdi layout_signal TDO -input 0x0004
ftdi layout_signal TMS -data 0x0008
ftdi layout_signal JTAG_SEL -data 0x0100 -oe 0x0100
transport select jtag
jtag newtap riscv0 cpu -irlen 5 -ircapture 0x1 -irmask 0x03 -enable
jtag newtap riscv0 cfg -irlen 8
target create riscv0.cpu riscv -chain-position riscv0.cpu -coreid 0
riscv0.cpu configure -work-area-phys 0x08000000 -work-area-size 10000 -work-area-backup 1
